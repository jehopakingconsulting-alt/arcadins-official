# Prometheus — configuration de scrape (S: Observability).
# Les métriques ARCADINS sont exportées via OpenTelemetry → collecteur OTLP →
# Prometheus remote-write, OU scrape direct d'un endpoint /metrics exposé par le
# collecteur. Ce fichier cible le collecteur OTel (pas l'app Next directement).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"] # exporter Prometheus du collecteur
        labels: { service: "arcadins", env: "production" }

  # Sonde blackbox (synthetic) des endpoints publics.
  - job_name: "blackbox-http"
    metrics_path: /probe
    params: { module: [http_2xx] }
    static_configs:
      - targets:
          - https://arcadins-official.vercel.app/api/health
          - https://arcadins-official.vercel.app/api/ready
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
