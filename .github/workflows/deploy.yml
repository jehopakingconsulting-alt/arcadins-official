name: Deploy (production)

# Déploiement Vercel avec PROMOTION FIABLE + SMOKE PUBLIC + ROLLBACK AUTOMATIQUE.
#
# IMPORTANT — pourquoi on ne health-check PAS l'URL de preview avant la promotion :
# les URLs de déploiement Vercel sont couvertes par la Deployment Protection et
# répondent 302 (redirection SSO) à un curl anonyme. Un readiness-gate qui exige
# 200 sur l'URL de preview échoue donc TOUJOURS, ce qui empêchait la promotion et
# figeait la production sur un ancien déploiement. On promeut d'abord, puis on
# vérifie l'ALIAS PUBLIC de production (non protégé) ; en cas d'échec → rollback.
#
# Secrets requis (GitHub → Settings → Secrets) :
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, PROD_URL
on:
  workflow_dispatch:
  push:
    branches: [master]

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      # 1) Build + déploiement prebuilt (non promu)
      - name: Vercel pull env
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # VERCEL_FORCE_NO_BUILD_CACHE=1 : indispensable. Sans lui, `vercel build`
      # réutilise le cache de build distant et republie l'ancien output compilé
      # (les hash de chunks ne changeaient jamais → correctifs invisibles en prod).
      - name: Build
        run: vercel build --prod --token=$VERCEL_TOKEN
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_FORCE_NO_BUILD_CACHE: "1"
      - name: Deploy (prebuilt) — auto-promu en production par --prod
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_FORCE_NO_BUILD_CACHE: "1"

      # 2) Promotion explicite — TOLÈRE le 409 (`deploy --prod` a déjà promu).
      #    L'URL de preview étant protégée (302 SSO), aucune vérif ici : elle se
      #    fait sur l'alias PUBLIC juste après.
      - name: Promote to production (tolère 409 déjà-promu)
        run: |
          out=$(vercel promote "${{ steps.deploy.outputs.url }}" --token=$VERCEL_TOKEN --yes 2>&1) || true
          echo "$out"
          echo "$out" | grep -qi "already the current production" && echo "Déjà promu par deploy --prod ✓" || true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # 3) Smoke post-promotion sur l'ALIAS PUBLIC (non protégé) + ROLLBACK auto
      - name: Post-promotion smoke + auto-rollback
        run: |
          ok=""
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.PROD_URL }}/api/health" || true)
            echo "prod /api/health try $i -> $code"
            if [ "$code" = "200" ]; then ok="1"; break; fi
            sleep 6
          done
          if [ -z "$ok" ]; then
            echo "Smoke KO → rollback"
            vercel rollback --token=$VERCEL_TOKEN --yes || true
            exit 1
          fi
          echo "Production OK (alias public 200)"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
