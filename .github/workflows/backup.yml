name: Backup (database)

# Sauvegarde logique quotidienne (pg_dump) en COMPLÉMENT des backups managés
# Supabase + PITR. Artefact chiffré conservé (rétention GitHub). Ne remplace pas
# le PITR — voir docs/ops/BACKUP.md et DISASTER_RECOVERY.md.
#
# Secret requis : SUPABASE_DB_URL (chaîne de connexion Postgres, jamais en clair).
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC quotidien
  workflow_dispatch:

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install pg_dump (script officiel PGDG, non interactif)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          # Script officiel PostgreSQL : configure le dépôt PGDG + la clé, sans TTY.
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          # Vérifie pg_dump — échoue immédiatement s'il manque.
          command -v pg_dump >/dev/null || { echo "❌ pg_dump introuvable"; exit 1; }
          pg_dump --version
      - name: Dump (custom format, compressé)
        run: |
          ts=$(date -u +%Y%m%d-%H%M)
          pg_dump "$SUPABASE_DB_URL" -Fc -f "arcadins-$ts.dump"
          echo "DUMP=arcadins-$ts.dump" >> "$GITHUB_ENV"
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      - name: Chiffrer (gpg symétrique)
        run: gpg --batch --yes --passphrase "${{ secrets.BACKUP_PASSPHRASE }}" -c "$DUMP"
      - name: Publier l'artefact chiffré
        uses: actions/upload-artifact@v4
        with:
          name: db-backup
          path: ${{ env.DUMP }}.gpg
          retention-days: 30
